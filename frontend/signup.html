<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M4 12h16M15 7l5 5-5 5" stroke="#e8a33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Checkpoint
    </div>
    <h1>Create an account</h1>
    <div class="sub">User accounts manage registration, schedules and feedback. Administrator accounts manage events, venues, speakers, sponsors and incidents.</div>

    <div id="signupMsg" class="msg error"></div>

    <div class="field-row"><label class="req">Full name</label><input id="signupName" placeholder="Amara Odutola"></div>
    <div class="field-row"><label class="req">Email</label><input id="signupEmail" type="email" placeholder="you@company.com"></div>
    <div class="field-row"><label class="req">Password</label><input id="signupPassword" type="password" placeholder="At least 6 characters"></div>
    <div class="field-row">
      <label class="req">Account type</label>
      <select id="signupRole">
        <option value="user">User — registration, my schedule, feedback</option>
        <option value="admin">Administrator — events, venues, speakers, sponsors, incidents</option>
      </select>
    </div>

    <button class="btn btn-amber" id="signupBtn" style="width:100%; margin-top:6px;">Create account</button>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
    <div class="auth-switch"><a href="index.html">← Back to home</a></div>
  </div>
</div>

<script src="js/helpers.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/pages/signup.js"></script>
</body>
</html>
