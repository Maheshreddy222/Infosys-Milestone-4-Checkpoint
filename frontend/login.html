<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M4 12h16M15 7l5 5-5 5" stroke="#e8a33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Checkpoint
    </div>
    <h1>Log in</h1>
    <div class="role-tabs">
      <button type="button" class="active" id="tabUser">Sign in as User</button>
      <button type="button" id="tabAdmin">Sign in as Administrator</button>
    </div>
    <div class="sub" id="loginSub">Sign in to register attendees, view your schedule and more.</div>

    <div id="loginMsg" class="msg error"></div>

    <div class="field-row"><label class="req">Email</label><input id="loginEmail" type="email" placeholder="you@company.com"></div>
    <div class="field-row"><label class="req">Password</label><input id="loginPassword" type="password" placeholder="••••••••"></div>

    <button class="btn btn-amber" id="loginBtn" style="width:100%; margin-top:6px;">Log in</button>

    <div class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></div>
    <div class="auth-switch"><a href="index.html">← Back to home</a></div>
  </div>
</div>

<script src="js/helpers.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
